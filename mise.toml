# Toolchain and tasks for devkit. `mise install` gets you a working checkout;
# `mise run ci` is exactly what CI runs.
#
# Task names match the other garm-ai repositories on purpose: `mise run test`
# means the same thing everywhere, so moving between repositories costs no
# relearning.

[tools]
go = "1.26"

[tasks.build]
description = "Build every package"
run = "go build ./..."

[tasks.test]
description = "Run the tests"
# -timeout because Go's default is ten minutes, and a test waiting on an HTTP
# server that never answers will sit there for all of it.
run = "go test ./... -race -count=1 -timeout 120s"

[tasks.lint]
description = "Vet the Go"
run = "go vet ./..."

[tasks.fmt]
description = "Format"
run = "go fmt ./..."

[tasks.idp]
description = "Run the dev identity provider with the example personas"
run = "go run ./cmd/garmdev idp --personas examples/personas.yaml"

[tasks.cli]
description = "Install the garm CLI at the pinned version"
# Pinned, not @latest, for the same reason examples pins it: the vocabulary
# a claims policy is checked against must not shift because someone upgraded
# a CLI on a laptop. garm is a BINARY here — devkit takes no module
# dependency on garm-ai/garm.
#
# v0.12.0, not the latest real tag (v0.11.0): `claims check` — what the
# claims-check task below needs — landed after v0.11.0. v0.12.0 does not
# exist yet; until a release containing `claims check` is tagged, this
# install step fails with a module-not-found error naming v0.12.0, which is
# the honest failure — a release is missing, not "unknown command" as if the
# wiring below were broken.
run = "go install github.com/garm-ai/garm/cmd/garm@v0.12.0"

[tasks."claims-check"]
description = "Assert examples/personas.yaml only references what the bank catalogue declares"
depends = ["cli"]
# devkit owns no catalogue of its own. The vocabulary this dev-IdP example is
# checked against is bank's, from garm-ai/examples (public) — EXAMPLES_DIR
# points at a checkout of it. CI checks one out fresh on every run; locally
# it defaults to a sibling checkout, which is how these repositories are
# conventionally cloned.
#
# The catalogue is BUILT here, from that checkout's proto, every run — never
# read from a bank.binpb on disk. That artifact is gitignored and generated
# in examples, so a copy lying around anywhere is only ever a stale guess at
# the real vocabulary.
run = """
set -e
EXAMPLES_DIR="${EXAMPLES_DIR:-../examples}"
WORK=$(mktemp -d)
trap 'rm -rf "$WORK"' EXIT
garm catalogue build --proto "$EXAMPLES_DIR/bank/proto" -o "$WORK/bank.binpb" --source garm-ai/examples/bank
garm claims check examples/personas.yaml --against "$WORK/bank.binpb"
"""

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "build", "test", "claims-check"]

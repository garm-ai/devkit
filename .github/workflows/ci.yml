# CI for devkit.
#
# Three jobs. The first is the ordinary one. The second asserts the boundary
# this repository exists to hold — asserted rather than documented, because a
# single careless import would end it silently. The third catches a
# different kind of drift: a compartment or tool set examples/personas.yaml
# names that the bank catalogue it is meant to illustrate no longer declares.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: mise run lint
      - run: mise run build
      - run: mise run test

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # devkit must not depend on the product.
      #
      # Two reasons, and the second is the one that bites. It keeps these
      # tools building when the tree does not — which is exactly when you
      # reach for them. And it keeps the minter and the verifier in separate
      # dependency graphs, so nothing that decides what an identity MAY DO can
      # ever reach the thing that hands identities out.
      - name: no dependency on the product
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'garm-ai/(garm|garmd|tool-go|tools)'; then
            echo "devkit depends on the product; see CLAUDE.md" >&2
            exit 1
          fi
          echo "ok: devkit depends on no garm module"

      # The reciprocal guard lives in garm and garmd: neither may require
      # this module. It is asserted there because that is where the violating
      # go.mod would be.
      - name: the example personas load
        run: go test ./internal/idp -run TestTheShippedExamplePersonasLoad -count=1

  # examples/personas.yaml is a worked example against bank's vocabulary, and
  # a name it references but the catalogue does not declare is not an error
  # anywhere else — the verifying daemon drops an unknown compartment rather
  # than refusing the token. devkit owns no catalogue of its own, so the
  # bank one is built fresh here from a checkout of garm-ai/examples (public)
  # — never read from a committed or downloaded artifact, since that catalogue
  # is gitignored and generated and a stale copy would make this check
  # authoritative about the wrong vocabulary.
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: checkout examples (public; source of the bank catalogue)
        uses: actions/checkout@v5
        with:
          repository: garm-ai/examples
          path: upstream-examples
          token: ''
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: examples/personas.yaml against a freshly built bank catalogue
        env:
          EXAMPLES_DIR: upstream-examples
        run: mise run claims-check
